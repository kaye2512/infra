---
- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check installed node_exporter version
  ansible.builtin.command: "{{ node_exporter_bin }} --version"
  register: node_exporter_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install node_exporter {{ node_exporter_version }}
  when: >-
    ('version ' ~ node_exporter_version ~ ' ')
    not in (node_exporter_installed.stdout | default('')) ~ (node_exporter_installed.stderr | default(''))
  block:
    - name: Create node_exporter temporary directory
      ansible.builtin.file:
        path: "{{ node_exporter_tmp_dir }}"
        state: directory
        mode: "0755"

    - name: Download node_exporter archive and verify checksum
      ansible.builtin.get_url:
        url: "{{ node_exporter_base_url }}/{{ node_exporter_archive }}"
        dest: "{{ node_exporter_tmp_dir }}/{{ node_exporter_archive }}"
        checksum: "sha256:{{ node_exporter_base_url }}/sha256sums.txt"
        mode: "0644"

    - name: Extract node_exporter archive
      ansible.builtin.unarchive:
        src: "{{ node_exporter_tmp_dir }}/{{ node_exporter_archive }}"
        dest: "{{ node_exporter_tmp_dir }}"
        remote_src: true

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "{{ node_exporter_tmp_dir }}/{{ node_exporter_name }}/node_exporter"
        dest: "{{ node_exporter_bin }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart node_exporter  

  always:
    - name: Remove node_exporter temporary files
      ansible.builtin.file:
        path: "{{ node_exporter_tmp_dir }}"
        state: absent

- name: Install node_exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Restart node_exporter

- name: Ensure node_exporter is started and enabled at boot
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending node_exporter restart
  ansible.builtin.meta: flush_handlers

- name: Wait for node_exporter to listen
  ansible.builtin.wait_for:
    host: "{{ node_exporter_listen_address }}"
    port: "{{ node_exporter_port }}"
    timeout: 30