---
node_exporter_version: "1.10.2"

node_exporter_arch_map:
  x86_64: amd64
  aarch64: arm64
node_exporter_arch: "{{ node_exporter_arch_map[ansible_architecture] }}"

node_exporter_name: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
node_exporter_archive: "{{ node_exporter_name }}.tar.gz"
node_exporter_base_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"

node_exporter_bin: /usr/local/bin/node_exporter
node_exporter_tmp_dir: /tmp/node_exporter
node_exporter_user: node_exporter

node_exporter_listen_address: "{{ ansible_default_ipv4.address }}"
node_exporter_port: 9100