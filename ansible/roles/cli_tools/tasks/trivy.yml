---
- name: Add Trivy apt repository
  ansible.builtin.deb822_repository:
    name: trivy
    types: deb
    uris: "https://aquasecurity.github.io/trivy-repo/deb"
    signed_by: "https://aquasecurity.github.io/trivy-repo/deb/public.key"
    state: present

- name: Install trivy
  ansible.builtin.apt:
    name: trivy
    state: present
    update_cache: true