---
- name: Check installed Helm version
  ansible.builtin.command: "{{ helm_bin }} version --short"
  register: helm_installed
  changed_when: false  
  failed_when: false    
  check_mode: false     

- name: Install Helm {{ helm_version }}
  when: (helm_installed.stdout | default('')).split('+')[0] != 'v' ~ helm_version
  block:
    - name: Create Helm temporary directory
      ansible.builtin.file:
        path: "{{ helm_tmp_dir }}"
        state: directory
        mode: "0755"

    - name: Download Helm archive and verify checksum
      ansible.builtin.get_url:
        url: "{{ helm_url }}"
        dest: "{{ helm_tmp_dir }}/{{ helm_archive }}"
        checksum: "sha256:{{ helm_url }}.sha256sum"
        mode: "0644"

    - name: Extract Helm archive
      ansible.builtin.unarchive:
        src: "{{ helm_tmp_dir }}/{{ helm_archive }}"
        dest: "{{ helm_tmp_dir }}"
        remote_src: true

    - name: Install Helm binary
      ansible.builtin.copy:
        src: "{{ helm_tmp_dir }}/linux-{{ helm_arch }}/helm"
        dest: "{{ helm_bin }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

  always:
    - name: Remove Helm temporary files
      ansible.builtin.file:
        path: "{{ helm_tmp_dir }}"
        state: absent