---
- name: Install Python Kubernetes client
  ansible.builtin.apt:
    name: python3-kubernetes
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Argo Helm repository
  become: false
  kubernetes.core.helm_repository:
    name: "{{ argocd_helm_repo_name }}"
    repo_url: "{{ argocd_helm_repo_url }}"

- name: Install Argo CD chart
  become: false
  kubernetes.core.helm:
    name: "{{ argocd_release_name }}"
    chart_ref: "{{ argocd_helm_repo_name }}/argo-cd"
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    wait: true            
    wait_timeout: 10m

- name: Read Argo CD initial admin secret
  become: false
  kubernetes.core.k8s_info:
    kind: Secret
    name: argocd-initial-admin-secret
    namespace: "{{ argocd_namespace }}"
  register: argocd_initial_secret

- name: Show Argo CD initial admin password
  ansible.builtin.debug:
    msg: "Argo CD admin password: {{ argocd_initial_secret.resources[0].data.password | b64decode }}"
  when: argocd_initial_secret.resources | length > 0