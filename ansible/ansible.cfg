[defaults]
inventory          = inventories/prod/my_hosts_aws_ec2.yml
roles_path         = ./roles
# Lab : le bastion est recréé à chaque session avec une nouvelle clé d'hôte.
# En vraie prod, on garde true et on gère known_hosts.
host_key_checking  = False
interpreter_python = auto_silent

[inventory]
# Seul le plugin AWS est essayé : plus de warnings yaml/ini parasites
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
# Moins d'allers-retours SSH par tâche, donc beaucoup plus rapide
pipelining = True