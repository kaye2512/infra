apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: 225989374284.dkr.ecr.eu-west-3.amazonaws.com/prod-ecr-repo:28d5673
          ports:
            - containerPort: 80
          resources:
            requests:            
              cpu: 50m
              memory: 64Mi
            limits:              
              cpu: 200m
              memory: 128Mi
          readinessProbe:       
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
        